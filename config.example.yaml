# OpenList Bot 配置文件
# 复制此文件为 config.yaml 并修改配置值

log_level: INFO

# 用户配置
# admin: 管理员 Telegram 用户 ID（拥有全部权限）
# bot_token: Telegram Bot Token（从 @BotFather 获取）
# member: 允许使用 /search 等命令的用户/群组 ID 白名单
#         ⚠️ 留空 [] = 所有人可用（搜索完全公开，含 bot 所在群的任意成员）；
#         若要限制访问，务必填入允许的用户 ID（或群组 chat_id，注意群 ID 会放行全群成员）
user:
  admin: 1234567890
  bot_token: "your_bot_token_here"
  member: []

# 网页聊天入口（可选）。取消下面注释即可启用；删除整个 web 段可关闭。
# 只运行网页时，将上面的 user.bot_token 设置为 ""，或者删除整个 user 段。
# 使用 ./openlist-bot hash-password 生成哈希（交互输入，不会回显密码）。
# 登录密码和二级密码分别生成，建议使用不同的密码。
# web:
#   bind: "127.0.0.1:8080"  # Docker 容器内改为 0.0.0.0:8080
#   username: "admin"
#   password_hash: '$argon2id$...替换为生成的完整哈希...'
#   secondary_password_hash: null  # 可选：填写另一份哈希，保护所有写入操作
#   cookie_secure: true  # HTTPS 使用 true；仅本机/可信内网 HTTP 调试设为 false

# OpenList 配置
openlist:
  openlist_host: "https://openlist.your-domain.com"
  openlist_token: "your_openlist_token"
  download_path: /115/girl
  download_tool: 115 Cloud

# 盘搜配置（可选）
pansou:
  pansou_host: "https://pansou.your-domain.com"
  pansou_token: "your_pansou_token"

# 代理配置（可选）
proxy:
  enable: false
  hostname: 127.0.0.1
  port: 10808
  scheme: http
